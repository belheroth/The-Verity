<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verity</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    html, body {
      background: transparent !important;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .splash-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: entrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .wordmark-wrap {
      position: relative;
      display: inline-block;
      padding: 20px 30px;
    }

    /* Core floating wordmark */
    .wordmark {
      font-size: 88px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -2px;
      line-height: 1;
      white-space: nowrap;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.8)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.95));
      display: flex;
      align-items: center;
    }

    .letter-v {
      color: #10b981;
      display: inline-block;
      text-shadow: 
        0 0 15px rgba(16, 185, 129, 0.9),
        0 0 35px rgba(16, 185, 129, 0.65),
        0 0 65px rgba(16, 185, 129, 0.4);
      animation: vPulse 1.8s ease-in-out infinite alternate;
    }

    .letter-erity {
      color: #ffffff;
      display: inline-block;
      text-shadow: 
        0 0 18px rgba(255, 255, 255, 0.45),
        0 0 35px rgba(16, 185, 129, 0.35);
    }

    /* High-intensity light flash sheen across the letters */
    .wordmark-flash {
      position: absolute;
      top: 20px;
      left: 30px;
      right: 30px;
      bottom: 20px;
      font-size: 88px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -2px;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      display: flex;
      align-items: center;
      background: linear-gradient(
        110deg,
        transparent 0%,
        transparent 28%,
        rgba(255, 255, 255, 0.98) 50%,
        rgba(52, 211, 153, 0.9) 55%,
        transparent 72%,
        transparent 100%
      );
      background-size: 260% 100%;
      background-position: 160% 0;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: sheenFlash 1.6s cubic-bezier(0.25, 1, 0.5, 1) 0.3s forwards;
    }

    /* Radiant optical flare burst */
    .flash-flare {
      position: absolute;
      top: 50%;
      left: 30px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(52, 211, 153, 0.8) 25%, rgba(16, 185, 129, 0.3) 50%, transparent 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      mix-blend-mode: screen;
      filter: blur(3px);
      animation: flareBurst 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
    }

    @keyframes entrance {
      0% {
        opacity: 0;
        transform: scale(0.88);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes vPulse {
      0% {
        text-shadow: 
          0 0 15px rgba(16, 185, 129, 0.8),
          0 0 35px rgba(16, 185, 129, 0.5),
          0 0 60px rgba(16, 185, 129, 0.3);
      }
      100% {
        text-shadow: 
          0 0 25px rgba(16, 185, 129, 1),
          0 0 50px rgba(52, 211, 153, 0.8),
          0 0 85px rgba(16, 185, 129, 0.55);
      }
    }

    @keyframes sheenFlash {
      0% {
        background-position: 160% 0;
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      70% {
        background-position: -60% 0;
        opacity: 1;
      }
      100% {
        background-position: -60% 0;
        opacity: 0;
      }
    }

    @keyframes flareBurst {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
        left: 45px;
      }
      20% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 1;
        left: 70px;
      }
      55% {
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 0.85;
        left: 200px;
      }
      80% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0.2;
        left: 290px;
      }
      100% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
        left: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="wordmark-wrap">
      <!-- Base stylized text -->
      <div class="wordmark">
        <span class="letter-v">V</span><span class="letter-erity">erity</span>
      </div>

      <!-- High-intensity flash sweep overlay -->
      <div class="wordmark-flash" aria-hidden="true">
        <span class="letter-v">V</span><span class="letter-erity">erity</span>
      </div>

      <!-- Animated optical flare beam -->
      <div class="flash-flare" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
